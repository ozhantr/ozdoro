name: Bug report
description: Report a reproducible problem in OzDoro
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain what you observed and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch OzDoro
        2. Start a focus session
        3. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.1
  - type: input
    id: version
    attributes:
      label: OzDoro version or commit hash
  - type: textarea
    id: logs
    attributes:
      label: Error output or screenshots (optional)
      description: Please remove personal or sensitive data before sharing.
