name: Feature request
description: Suggest a small improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem you want to solve
      description: OzDoro aims to remain a small, menu-bar-only application.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution and alternatives
    validations:
      required: true
